# Records pronunciation MP3s for every Japanese word and kana in the app and commits them to audio/.
# Runs when the content changes, or by hand from the Actions tab ("Run workflow").
name: Record audio
on:
  push:
    branches: [main]
    paths: ['data/content.js', 'js/kana-data.js', 'js/session.js', 'js/ui.js', 'tools/**', '.github/workflows/audio.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: audio
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts
      - run: node tools/list-audio.js > tools/audio-list.json
      - run: python tools/make_audio.py
      - name: Commit recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio tools/audio-list.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update pronunciation audio"
          git push
